[project]
name = "docking"
version = "0.1.0"
description = "Curcumin derivative generation, molecular profiling, and AutoDock Vina docking pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipython>=8.0",
    "loguru>=0.7.3",
    "openbabel>=3.2.1",
    "pubchempy>=1.0.5",
    "rdkit>=2026.3.6",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
]
